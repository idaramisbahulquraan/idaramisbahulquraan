name: Build Android App (APK)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Assets & Sync Capacitor
        run: |
          node tools/build_assets.js
          npx cap add android || true
          npx cap sync

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android App (Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android App (Release Unsigned APK & AAB)
        run: |
          cd android
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-release
          path: android/app/build/outputs/bundle/release/app-release.aab
